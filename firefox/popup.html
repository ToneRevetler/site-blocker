<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Sites Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <svg class="shield" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 5v6c0 5 3.4 8.6 8 9c4.6-.4 8-4 8-9V5l-8-3z" fill="#fff" stroke="#e8433a" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 2v18c4.6-.4 8-4 8-9V5l-8-3z" fill="#e8433a"/>
      </svg>
      <h1>Sites Blocker</h1>
    </div>
    <span id="protection-badge" class="protection-badge">
      <span class="dot"></span>
      <span class="protection-label">Proteção ativa</span>
    </span>
  </header>

  <main>
    <section id="view-list" class="view">
      <div class="list-header">
        <h2>Sites bloqueados</h2>
        <span id="site-count" class="count-badge">0 sites</span>
      </div>

      <button id="add-site-btn" type="button" class="btn btn-primary btn-block">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Adicionar site
      </button>

      <div id="site-list"></div>

      <div id="empty-state" class="empty-state">
        <div class="empty-illustration">
          <svg viewBox="0 0 120 90" width="120" height="90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="8" width="100" height="70" rx="8" fill="#fdeeec" stroke="#f7d3cf"/>
            <rect x="10" y="8" width="100" height="18" rx="8" fill="#fbe1de"/>
            <circle cx="20" cy="17" r="2.5" fill="#f0a6a0"/>
            <circle cx="28" cy="17" r="2.5" fill="#f0a6a0"/>
            <circle cx="36" cy="17" r="2.5" fill="#f0a6a0"/>
            <rect x="26" y="38" width="24" height="24" rx="4" fill="#f7d3cf"/>
            <rect x="56" y="40" width="40" height="6" rx="3" fill="#f7d3cf"/>
            <rect x="56" y="52" width="30" height="6" rx="3" fill="#f7d3cf"/>
          </svg>
          <svg class="empty-shield" viewBox="0 0 24 24" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 5v6c0 5 3.4 8.6 8 9c4.6-.4 8-4 8-9V5l-8-3z" fill="#e8433a"/>
            <path d="M9.5 12l1.8 1.8L15 10" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3>Nenhum site bloqueado</h3>
        <p>Adicione sites que tiram sua atenção e mantenha o foco no que importa.</p>
        <button id="add-first-site-btn" type="button" class="btn btn-primary btn-block">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Adicionar primeiro site
        </button>
        <button id="block-current-btn" type="button" class="btn btn-outline btn-block">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/></svg>
          <span id="block-current-label">Bloquear este site</span>
        </button>
      </div>

      <button id="toggle-protection-btn" type="button" class="btn btn-outline-danger btn-block">
        <svg id="toggle-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <span id="toggle-protection-label">Pausar bloqueio</span>
      </button>
    </section>

    <section id="view-add" class="view hidden">
      <div class="add-header">
        <button id="back-btn" type="button" class="icon-btn" aria-label="Voltar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h2>Adicionar site</h2>
      </div>
      <p class="add-subtitle">Digite o endereço do site que você quer bloquear.</p>

      <form id="add-form">
        <label for="site-input">Endereço do site</label>
        <div class="input-group">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 5.7 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.7-4-9s1.5-6.5 4-9z"/></svg>
          <input
            type="text"
            id="site-input"
            placeholder="exemplo.com"
            autocomplete="off"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Bloquear site</button>
        <button type="button" id="cancel-btn" class="btn btn-link btn-block">Cancelar</button>
      </form>

      <div class="info-box">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 5v6c0 5 3.4 8.6 8 9c4.6-.4 8-4 8-9V5l-8-3z" fill="#e8433a"/>
        </svg>
        <p>O site e seus subdomínios serão bloqueados.</p>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
